services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnb}
      POSTGRES_DB: ${POSTGRES_DB:-meu_negocio_no_bolso}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mnb}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # `image:` lets a deploy pull a pre-built, CI-tested tag (`docker compose pull
    # api && docker compose up -d api`, no rebuild on the host — see
    # docs/DEPLOYMENT.md) while `build:` keeps `docker compose up --build` working
    # unchanged for local dev.
    image: ${IMAGE:-meu-negocio-no-bolso-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnb}:${POSTGRES_PASSWORD:-mnb}@postgres:5432/${POSTGRES_DB:-meu_negocio_no_bolso}?schema=public
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  postgres_data:
