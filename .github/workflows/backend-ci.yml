name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mnb
          POSTGRES_PASSWORD: mnb
          POSTGRES_DB: meu_negocio_no_bolso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mnb:mnb@localhost:5432/meu_negocio_no_bolso?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-please-rotate
      JWT_REFRESH_SECRET: ci-refresh-secret-please-rotate
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ci-cookie-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e -- --ci
